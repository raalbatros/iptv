<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M3U Canlı TV Editörü</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface2:#eef2f8;
  --border:#d9e1ec;
  --accent:#2d6cdf;
  --accent2:#6b5cff;
  --text:#162033;
  --text-dim:#6b7280;
  --red:#e5484d;
  --green:#1f9d55;
  --shadow:0 10px 30px rgba(22,32,51,.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  box-shadow:var(--shadow);
}

.logo{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:18px;
}

.logo span{
  color:var(--accent);
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

#statusMsg{
  font-size:13px;
  color:var(--text-dim);
}

.btn{
  padding:8px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:.15s;
}

.btn-accent{
  background:var(--accent);
  color:#fff;
}

.btn-ghost{
  background:transparent;
  border:1px solid var(--border);
}

.btn-danger{
  background:transparent;
  color:var(--red);
  border:1px solid #e5484d33;
}

.btn-sm{
  padding:5px 10px;
  font-size:12px;
}

.app{
  display:flex;
  flex:1;
  overflow:hidden;
}

.left-panel{
  width:280px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.panel-header{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panel-title{
  font-family:'Syne',sans-serif;
  font-size:13px;
  font-weight:700;
  color:var(--text-dim);
}

.series-list{
  flex:1;
  overflow-y:auto;
  padding:8px;
}

.series-item{
  padding:10px 12px;
  border-radius:10px;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  border:1px solid transparent;
  transition:.15s;
}

.series-item:hover{
  background:var(--surface2);
}

.series-item.active{
  background:var(--surface2);
  border-color:#2d6cdf33;
}

.series-item.dragging{
  opacity:.4;
  transform:scale(.98);
}

.series-poster-thumb{
  width:32px;
  height:32px;
  border-radius:8px;
  object-fit:cover;
  background:var(--border);
}

.series-info{
  flex:1;
  min-width:0;
}

.series-name{
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.series-meta{
  font-size:11px;
  color:var(--text-dim);
}

.right-panel{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  color:var(--text-dim);
}

.empty-icon{
  font-size:48px;
}

.series-editor{
  padding:24px;
}

.editor-top{
  display:flex;
  gap:20px;
}

.poster-img{
  width:100px;
  height:100px;
  border-radius:14px;
  object-fit:cover;
  background:var(--surface2);
}

.series-title-display{
  font-family:'Syne',sans-serif;
  font-size:24px;
  font-weight:800;
  margin-bottom:8px;
}

.series-desc{
  font-size:13px;
  color:var(--text-dim);
}

.episodes-panel{
  flex:1;
  overflow-y:auto;
  padding:16px 24px;
}

.channel-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:var(--surface);
  border-radius:12px;
  margin-bottom:8px;
  border:1px solid var(--border);
}

.ch-num{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:13px;
  cursor:grab;
  user-select:none;
}

.ch-name{
  width:120px;
  font-size:13px;
}

.ch-link,.ch-title{
  flex:1;
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:12px;
  outline:none;
}

.filled{
  border-color:#1f9d5566;
}

.row-actions{
  display:flex;
  gap:6px;
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.modal-overlay.show{
  opacity:1;
  pointer-events:all;
}

.modal{
  background:var(--surface);
  border-radius:18px;
  padding:24px;
  width:500px;
  max-width:95vw;
}

.modal-title{
  font-family:'Syne',sans-serif;
  font-size:16px;
  font-weight:700;
  margin-bottom:16px;
}

.form-group{
  margin-bottom:14px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
}

input{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">m3u<span>live</span></div>

  <div class="header-actions">
    <span id="statusMsg"></span>

    <button class="btn btn-ghost btn-sm" onclick="showSettings()">
      ⚙ Ayarlar
    </button>

    <button class="btn btn-accent" onclick="saveToGithub()">
      ↑ GitHub'a Kaydet
    </button>
  </div>
</header>

<div class="app">

  <div class="left-panel">

    <div class="panel-header">
      <span class="panel-title">Kanallar</span>

      <button class="btn btn-accent btn-sm" onclick="showAddChannel()">
        + Ekle
      </button>
    </div>

    <div class="series-list" id="channelList"></div>

  </div>

  <div class="right-panel">

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📡</div>
      <div>Soldan kanal seç</div>
    </div>

    <div id="editorArea" style="display:none; flex-direction:column; flex:1; overflow:hidden;">

      <div class="series-editor" id="channelEditor"></div>

      <div class="episodes-panel" id="channelPanel"></div>

    </div>

  </div>

</div>

<!-- Kanal Ekle -->

<div class="modal-overlay" id="addChannelModal">

  <div class="modal">

    <div class="modal-title">Yeni Kanal Ekle</div>

    <div class="form-group">
      <label>Kanal Adı</label>
      <input type="text" id="chName">
    </div>

    <div class="form-group">
      <label>Kanal Linki</label>
      <input type="text" id="chUrl">
    </div>

    <div class="form-group">
      <label>Logo</label>
      <input type="text" id="chLogo">
    </div>

    <div class="form-group">
      <label>EPG ID</label>
      <input type="text" id="chEpgId">
    </div>

    <div class="form-group">
      <label>Yedek Linkler</label>

      <div id="backupLinksBox"></div>

      <button class="btn btn-ghost btn-sm" onclick="addBackupField()" style="margin-top:8px;">
        + Yedek Ekle
      </button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('addChannelModal')">
        İptal
      </button>

      <button class="btn btn-accent" onclick="addChannel()">
        Ekle
      </button>
    </div>

  </div>

</div>

<script>

let data = { channels: [] };

let activeChannel = null;

let backupCount = 3;

let dragIndex = null;

function loadData(){
  try{
    data = JSON.parse(localStorage.getItem('m3uLiveEditor') || '{"channels":[]}');
  }catch{
    data = { channels: [] };
  }
}

function saveData(){
  localStorage.setItem('m3uLiveEditor', JSON.stringify(data));
}

function setStatus(msg, type){
  const el = document.getElementById('statusMsg');

  el.textContent = msg;

  el.style.color =
    type === 'ok'
      ? 'green'
      : type === 'err'
      ? 'red'
      : '#666';
}

function showModal(id){
  document.getElementById(id).classList.add('show');
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
}

function showSettings(){
  alert('Ayar bölümü burada olacak.');
}

function showAddChannel(){

  document.getElementById('chName').value = '';
  document.getElementById('chUrl').value = '';
  document.getElementById('chLogo').value = '';
  document.getElementById('chEpgId').value = '';

  backupCount = 3;

  renderBackupFields();

  showModal('addChannelModal');
}

function renderBackupFields(){

  const box = document.getElementById('backupLinksBox');

  box.innerHTML = '';

  for(let i=0;i<backupCount;i++){

    const div = document.createElement('div');

    div.className = 'form-group';

    div.innerHTML = `
      <input type="text" class="backup-input" placeholder="https://...">
    `;

    box.appendChild(div);
  }
}

function addBackupField(){

  backupCount++;

  renderBackupFields();
}

function addChannel(){

  const backups =
    [...document.querySelectorAll('.backup-input')]
    .map(i => i.value.trim())
    .filter(Boolean);

  data.channels.push({

    id: Date.now(),

    name: document.getElementById('chName').value.trim(),

    url: document.getElementById('chUrl').value.trim(),

    logo: document.getElementById('chLogo').value.trim(),

    epgId: document.getElementById('chEpgId').value.trim(),

    backups

  });

  saveData();

  renderChannelList();

  closeModal('addChannelModal');
}

function renderChannelList(){

  const list = document.getElementById('channelList');

  list.innerHTML = data.channels.map((c,i)=>`

    <div
      class="series-item ${activeChannel===i?'active':''}"
      draggable="true"

      ondragstart="handleDragStart(${i},event)"
      ondragover="handleDragOver(event)"
      ondrop="handleDrop(${i},event)"
      ondragend="handleDragEnd(event)"

      onclick="selectChannel(${i})"
    >

      <div class="ch-num">↕</div>

      <img
        class="series-poster-thumb"
        src="${c.logo || ''}"
        onerror="this.style.display='none'"
      >

      <div class="series-info">
        <div class="series-name">${c.name || 'İsimsiz Kanal'}</div>

        <div class="series-meta">
          ${c.epgId || 'EPG yok'}
        </div>
      </div>

    </div>

  `).join('');
}

function handleDragStart(index,e){

  dragIndex = index;

  e.dataTransfer.effectAllowed = 'move';

  e.dataTransfer.setData('text/plain', index);

  e.currentTarget.classList.add('dragging');
}

function handleDragOver(e){
  e.preventDefault();
}

function handleDrop(index,e){

  e.preventDefault();

  const fromIndex =
    Number(e.dataTransfer.getData('text/plain'));

  if(isNaN(fromIndex)) return;

  moveChannel(fromIndex,index);
}

function handleDragEnd(e){

  e.currentTarget.classList.remove('dragging');

  dragIndex = null;
}

function moveChannel(from,to){

  if(from===to) return;

  const item = data.channels.splice(from,1)[0];

  data.channels.splice(to,0,item);

  saveData();

  renderChannelList();
}

function selectChannel(i){

  activeChannel = i;

  renderChannelList();

  renderEditor();

  document.getElementById('emptyState').style.display='none';

  document.getElementById('editorArea').style.display='flex';
}

function renderEditor(){

  const c = data.channels[activeChannel];

  if(!c) return;

  document.getElementById('channelEditor').innerHTML = `

    <div class="editor-top">

      <img
        class="poster-img"
        src="${c.logo || ''}"
        onerror="this.style.display='none'"
      >

      <div>

        <div class="series-title-display">
          ${c.name || 'İsimsiz Kanal'}
        </div>

        <div class="series-desc">
          Kanal düzenleme paneli
        </div>

      </div>

    </div>
  `;

  document.getElementById('channelPanel').innerHTML = `

    <div class="channel-row">

      <div class="ch-num">N</div>

      <div class="ch-name">Kanal Adı</div>

      <input
        class="ch-title"
        type="text"
        value="${escapeHtml(c.name || '')}"

        oninput="
          updateField('name',this.value);
          this.classList.toggle('filled',this.value.length>0)
        "
      >

    </div>

    <div class="channel-row">

      <div class="ch-num">#</div>

      <div class="ch-name">Ana Link</div>

      <input
        class="ch-link"
        type="text"
        value="${escapeHtml(c.url || '')}"

        oninput="
          updateField('url',this.value);
          this.classList.toggle('filled',this.value.length>0)
        "
      >

    </div>

    <div class="channel-row">

      <div class="ch-num">L</div>

      <div class="ch-name">Logo</div>

      <input
        class="ch-link"
        type="text"
        value="${escapeHtml(c.logo || '')}"

        oninput="
          updateField('logo',this.value);
          this.classList.toggle('filled',this.value.length>0)
        "
      >

    </div>

    <div class="channel-row">

      <div class="ch-num">E</div>

      <div class="ch-name">EPG</div>

      <input
        class="ch-link"
        type="text"
        value="${escapeHtml(c.epgId || '')}"

        oninput="
          updateField('epgId',this.value);
          this.classList.toggle('filled',this.value.length>0)
        "
      >

    </div>

    ${(c.backups || []).map((b,idx)=>`

      <div class="channel-row">

        <div class="ch-num">${idx+1}</div>

        <div class="ch-name">Yedek</div>

        <input
          class="ch-link"
          type="text"
          value="${escapeHtml(b)}"

          oninput="
            updateBackup(${idx},this.value);
            this.classList.toggle('filled',this.value.length>0)
          "
        >

      </div>

    `).join('')}

  `;
}

function updateField(key,value){

  const c = data.channels[activeChannel];

  if(!c) return;

  c[key] = value;

  saveData();

  renderChannelList();

  renderEditor();
}

function updateBackup(idx,value){

  const c = data.channels[activeChannel];

  if(!c) return;

  c.backups[idx] = value;

  saveData();
}

function generateM3U(){

  let m3u = '#EXTM3U\n\n';

  for(const ch of data.channels){

    m3u += `#EXTINF:-1 tvg-id="${ch.epgId || ''}" tvg-logo="${ch.logo || ''}",${ch.name}\n`;

    m3u += `${ch.url || ''}\n`;
  }

  return m3u;
}

/*
YEDEK LİNKLER BURADA BİLEREK KULLANILMIYOR
SADECE localStorage'da saklanıyor
M3U export'a gitmiyor
*/

async function saveToGithub(){

  console.log(generateM3U());

  setStatus('M3U oluşturuldu', 'ok');
}

function escapeHtml(str){

  return String(str || '')

    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

document.querySelectorAll('.modal-overlay').forEach(m=>{

  m.addEventListener('click',e=>{

    if(e.target===m){

      m.classList.remove('show');
    }
  });
});

loadData();

renderChannelList();

</script>

</body>
</html>
